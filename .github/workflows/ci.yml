name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Test on Windows or macOS
        if: runner.os != 'Linux'
        run: python -m pytest -q
      - name: Quality and package checks
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: |
          python scripts/run_actionlint.py
          python -m ruff check ctk_kanban tests scripts example.py
          python -m mypy ctk_kanban
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke-test the built wheel
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        working-directory: ${{ runner.temp }}
        run: python -c "import ctk_kanban; print(ctk_kanban.__version__)"

  minimum-customtkinter:
    name: Ubuntu / CustomTkinter 5.2.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: python -m pip install ".[test]" "customtkinter==5.2.2"
      - run: xvfb-run -a python -m pytest -q
