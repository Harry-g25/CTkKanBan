name: Publish to PyPI

run-name: Publish ${{ github.event.release.tag_name || inputs.tag }} to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, with or without a leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: python -m pip install ".[dev]"
      - name: Validate the release tag
        shell: bash
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify tag matches package version
        run: >-
          python -c "import os, ctk_kanban;
          tag = os.environ['RELEASE_TAG'];
          expected = ctk_kanban.__version__;
          actual = tag.removeprefix('v');
          assert actual == expected, f'release tag {tag!r} does not match package version {expected!r}'"
      - run: xvfb-run -a python -m pytest -q
      - run: python -m ruff check ctk_kanban tests scripts example.py
      - run: python -m mypy ctk_kanban
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke-test the built wheel
        working-directory: ${{ runner.temp }}
        run: python -c "import ctk_kanban; print(ctk_kanban.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/CTkKanBan/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
