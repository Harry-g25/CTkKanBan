name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build TestPyPI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux display server
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Install release dependencies
        run: python -m pip install ".[test,quality,release]"
      - name: Test and build
        run: |
          python -m ruff check ctk_kanban tests example_all_features.py example_sqlite.py scripts
          python -m mypy
          python scripts/check_docs.py
          xvfb-run -a python -m pytest -q
          python -m build
          python scripts/validate_dist.py --dist dist
          python scripts/smoke_install.py --wheel-dir dist
      - name: Upload TestPyPI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish with trusted publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ctk-kanban
    permissions:
      actions: read  # Download the build job's artifact.
      contents: read
      id-token: write  # Authenticate to TestPyPI without a token.
    steps:
      - name: Download TestPyPI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: test-pypi-distributions
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
          verbose: true
