name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest runnable example and sample board data that reproduces the issue.
      render: python
    validations:
      required: true
  - type: dropdown
    id: persistence
    attributes:
      label: Persistence mode
      options:
        - In-memory only
        - Built-in SQLite adapter
        - Custom KanbanDataSource
        - Legacy on_data_changed callback
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: CTkKanban, Python, CustomTkinter, and operating-system versions.
      placeholder: ctk-kanban 0.2.0, Python 3.14, CustomTkinter 5.2.2, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and tracebacks
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private database data from the report.
          required: true

