[tox]
requires = tox>=4.23
env_list = py, quality

[testenv]
description = run the focused test suite
extras = test
pass_env =
    DISPLAY
    WAYLAND_DISPLAY
    XAUTHORITY
commands = python -m pytest -q

[testenv:quality]
description = lint and type-check the package
extras = dev
commands =
    python -m ruff check ctk_kanban tests example.py
    python -m mypy ctk_kanban
