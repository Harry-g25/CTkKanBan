[tox]
requires = tox>=4.23
env_list = py310, py311, py312, py313, py314, ctk-min, ctk-current, lint, type, package
skip_missing_interpreters = true

[testenv]
description = run the test suite
extras = test
commands = python -m pytest -q
pass_env = DISPLAY, WAYLAND_DISPLAY

[testenv:ctk-min]
description = run tests with the minimum supported CustomTkinter release
base_python = py314
extras = test
deps = customtkinter==5.2.2
commands = python -m pytest -q
pass_env = DISPLAY, WAYLAND_DISPLAY

[testenv:ctk-current]
description = run tests with the current supported CustomTkinter major release
base_python = py314
extras = test
deps = customtkinter>=6,<7
commands = python -m pytest -q
pass_env = DISPLAY, WAYLAND_DISPLAY

[testenv:lint]
description = run static lint checks
base_python = py314
extras = quality
commands =
    python -m ruff check ctk_kanban tests example_all_features.py example_sqlite.py scripts
    python scripts/check_docs.py
    python scripts/run_actionlint.py

[testenv:type]
description = type-check public contracts and persistence modules
base_python = py314
extras = quality
commands = python -m mypy

[testenv:package]
description = build and validate the PyPI distributions
base_python = py314
extras = release
commands =
    python -m build --outdir "{env_tmp_dir}/dist"
    python scripts/validate_dist.py --dist "{env_tmp_dir}/dist"
