[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctk-kanban"
version = "0.1.0"
description = "A configurable, database-independent Kanban board for CustomTkinter"
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2.2"]

[tool.setuptools.packages.find]
include = ["ctk_kanban*"]
