[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CTkKanBan"
dynamic = ["version"]
description = "A small, predictable Kanban board for CustomTkinter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Harry Gomm", email = "Harry-g25@users.noreply.github.com"},
]
keywords = ["customtkinter", "kanban", "desktop", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["customtkinter>=6.0.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8.3"]
dev = [
    "build>=1.2",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "tox>=4.23",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/Harry-g25/CTkKanBan"
Documentation = "https://harry-g25.github.io/CTkKanBan/"
Changelog = "https://github.com/Harry-g25/CTkKanBan/blob/main/CHANGELOG.md"
Source = "https://github.com/Harry-g25/CTkKanBan"
Issues = "https://github.com/Harry-g25/CTkKanBan/issues"

[tool.setuptools.packages.find]
include = ["ctk_kanban*"]

[tool.setuptools.package-data]
ctk_kanban = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "ctk_kanban.version.__version__"}

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["ctk_kanban"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_unused_configs = true
